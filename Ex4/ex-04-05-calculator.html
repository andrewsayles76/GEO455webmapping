<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Working with user input</title>
    </head>
    <body>
         <p>Equation = (1st + 2nd) / (3rd + 4th) </p>
        <br>
        <p>First number: <input type="number" id="num1" min="-100" max="100" value=""></p>
        <p>Second number: <input type="number" id="num2" min="-100" max="100" value=""></p>
        <p>Third number: <input type="number" id="num3" min="-100" max="100" value=""></p>
        <p>Forth number: <input type="number" id="num4" min="-100" max="100" value=""></p>
        
        <input type="button" id="MATH" value="MATH!">
        <p id="result"></p>
        
        
        <script>
            var num1 = document.getElementById("num1");
            var num2 = document.getElementById("num2");
             var num3 = document.getElementById("num1");
            var num4 = document.getElementById("num2");
            var result = document.getElementById("result");
            
            document.getElementById("MATH").addEventListener("click", function() {
                result.innerHTML = "The result is: " + (num1.value + num2.value) / (num3.value + num4.value);
            });
        </script>
    </body>
</html>
