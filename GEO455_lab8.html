<!DOCTYPE html>
<html lang="en">
<head>
  <title>Flow Map</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
 <link rel="stylesheet" href="leaflet.css"/>
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>

<body>

         <!-- Top bar -->
<nav class="navbar navbar-dark text-center bg-dark sticky-top justify-content-center">
  <span class="navbar-brand fw-semibold">Lab 8: Commute Flow Map to Dane County (2011-2015)</span></nav>
  
   <div id="description">
    <h3>Description</h3>
    
     <p>
       The flow map is visualizing commuter data into Dane County, Wisconsin (2011-2015). 
       The arrows color represent the volume of workers entering Dane county from neighbooring counties
    </p>
  </div>
  
<div id="map"></div>
  
<!-- Migration layer controls -->
<div id="controls" style="
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
">
  <button class="btn btn-light btn-md" onclick="migrationLayer.show()">Show</button>
  <button class="btn btn-light btn-md" onclick="migrationLayer.hide()">Hide</button>
  <button class="btn btn-success btn-md" onclick="migrationLayer.play()">Play</button>
  <button class="btn btn-danger btn-md" onclick="migrationLayer.pause()">Pause</button>
</div>

<!-- Legend -->
<div id="legend-overlay" style="
  position: fixed;
  bottom: 5px;
  right: 5px;
  z-index: 1000;
  background: white;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  min-width: 180px;
"></div>
  
  
<script src="leaflet.js"></script>
<script src="leaflet.migrationLayer.js"></script>
<script src="map_lab8.js"></script>

</body>
</html>
