<!DOCTYPE html>
<html lang="en">
    <head>
    <title>ex3-03</title>
    </head>
<body>

    <h2>JavaScript Functions</h2>

    <p id="Addition"></p>
    <p id="greet"></p>
    <p id="f2c"></p>
    <p id="method"></p>
    <p id="method1"></p>
    <p id="len1"></p>
    <p id="len2"></p>
    <p id="pop_method"></p>
    <p id="push_method"></p>



    <script>
        
        function Addition(p1, p2) {
            return p1 + p2;
        };
        
        document.getElementById("Addition").innerHTML = "This is result of Addition function: " + Addition(1000, 500);
        // change the parameters and check ..
        
        // create a function to return square root of a number ..
        

        
        function greeting() {
            return ("Hey man!");
        };
        
        document.getElementById("greet").innerHTML = "What do I say when I greet someone: "+ greeting();
        
        
        
        function to_Celsius(f) {
            return (5/9) * (f-32);
        };
        
        document.getElementById("f2c").innerHTML = "This is Celsius Conversion (32 F): " + to_Celsius(32)+" C";
        
        
        
        var person = {
            firstName: "Andrew",
            lastName: "Sayles",
            age: 22,
            eyeColor: "brown",
            fullName: function() {return this.firstName + " " + this.lastName;}
        };
        document.getElementById("method").innerHTML = person.fullName();
        document.getElementById("method1").innerHTML = person.fullName().toUpperCase() + " loved to play video games.";
        
        
        var a = [1, 7, 15, 16, 7, [3, 4, 5, 6, 7, 8], 6, 7, 8];
        document.getElementById("len1").innerHTML = "The length of the variable is: " + a.length;
        document.getElementById("len2").innerHTML = "The length of the 5th element is: " + a[5].length;  
        
        
        var midwest = ["Wisconsin", "Minnesota", "Iowa", "Illinois", "South Dakota"];
        midwest.pop();
        document.getElementById("pop_method").innerHTML = midwest; //removes the last element
        midwest.push("Michigan");
        document.getElementById("push_method").innerHTML = midwest;// adds michigan at the end
        midwest.pop()
         document.getElementById("pop_method").innerHTML = midwest


    

    </script>

</body>
</html>
