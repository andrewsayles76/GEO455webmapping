<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ex-7-5: UI</title>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
            crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js"></script> <!-- make sure jQuery UI library js file version and css version are compatible and matches -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.2/themes/ui-lightness/jquery-ui.css">

    <style>
        #haddock {
            float: left;
            width: 200px;
            height: 200px;
            cursor: move;
        }

        #ship {
            float: right;
            width: 300px;
            height: 300px;
            border: 4px solid transparent;
        }

        #message {
            clear: both;
            padding-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <script>
        $(function () {
            $("#haddock").draggable();

            $("#ship").droppable({
                drop: function () {
                    $(this).css("border", "4px yellow solid");
                    $("#message").text("Success! haddock made it to the ship.");
                }
            });
        });
    </script>

    <h1>Haddock goes to the ship</h1>

    <div>
        <img id="haddock" src="img/captain-haddock_v2.jpg" alt="haddock">
        <img id="ship" src="img/ship.jpg" alt="Ship">
    </div>

    <p id="message">Drag haddock to the ship.</p>


</body>
</html>
